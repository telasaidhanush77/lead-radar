name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: lead, POSTGRES_PASSWORD: lead, POSTGRES_DB: lead_test}
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U lead" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: pytest -q
